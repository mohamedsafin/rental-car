# frontend/nginx.conf
# ---------------------------------------------------------------------------
# Serving a single-page app has exactly one non-obvious requirement: every
# unknown path must return index.html, because the routes live in the browser.
# Without `try_files`, a customer who refreshes the page on /cars/<id> gets a
# 404 from nginx for a route that works perfectly when navigated to.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the nginx version to every caller.
    server_tokens off;

    # Hashed filenames from the build, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is what points at the hashed assets,
    # and a stale copy sends returning visitors to files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers the API sets for itself; the static host has to set its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
