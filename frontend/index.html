<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAE Car Rental — Premium car rental in Dubai, Abu Dhabi &amp; Sharjah</title>
    <meta
      name="description"
      content="Premium vehicles, transparent pricing and flexible pickup across Dubai, Abu Dhabi and Sharjah. Search real availability and see the full price before you book."
    />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Two families, each with one job.

      Geist carries the interface and the display headings: a neo-grotesque that
      stays crisp at 13px and still looks deliberate at 80px bold, which is what
      lets one family do both instead of pairing a UI font with a display font.

      Instrument Serif appears only as an italic accent on a handful of editorial
      phrases. Used everywhere it would read as a wedding invitation; used on one
      phrase per section it is what separates "brand site" from "web app".

      Preconnect first so the font request does not wait on a fresh DNS + TLS
      handshake, and `display=swap` so text paints immediately in the fallback
      rather than leaving the page blank while the webfont downloads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
